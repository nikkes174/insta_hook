[project]
name = "instagram-meta-webhook"
version = "0.1.0"
description = "Production-ready Instagram Meta comments webhook"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.20,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["anyio>=4.8,<5", "pytest>=8.3,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
