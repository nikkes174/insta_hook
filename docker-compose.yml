services:
  instagram-webhook:
    build: .
    restart: unless-stopped
    env_file: [.env]
    ports: ["127.0.0.1:8002:8000"]
    volumes: ["./data:/app/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
